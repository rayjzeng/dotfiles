# Config
set -g default-terminal "screen-256color"			# default 256 color support
set -g set-titles on
set -g set-titles-string "#T"
set -ga terminal-overrides ",xterm-256color*:Tc"

set -g default-command "${SHELL}"				# don't launch login shells
set -g mouse on									# mouse support
set -g mode-keys vi								# vi in copy mode
set -g status-keys emacs						# emacs bindings in prompt
set -s escape-time 10							# don't delay escape

unbind-key C-b
set-option -g prefix C-space
bind C-space send-prefix

set -g history-limit 500000

# integrations
set -g focus-events on
set -s set-clipboard on							# pass through clipboard requests
set -as terminal-features ',screen*:clipboard'	# nested tmux: forward copies to outer tmux

# Pain control: pane navigation (cycle through panes)
bind-key j   select-pane -t :.+
bind-key C-j select-pane -t :.+
bind-key k   select-pane -t :.-
bind-key C-k select-pane -t :.-

# Pain control: window movement
bind-key -r "<" swap-window -d -t -1
bind-key -r ">" swap-window -d -t +1

# Pain control: pane resizing
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5

# Pain control: pane splitting (preserves current path)
bind-key "|" split-window -h -c "#{pane_current_path}"
bind-key "\\" split-window -fh -c "#{pane_current_path}"
bind-key "-" split-window -v -c "#{pane_current_path}"
bind-key "_" split-window -fv -c "#{pane_current_path}"
bind-key "%" split-window -h -c "#{pane_current_path}"
bind-key '"' split-window -v -c "#{pane_current_path}"

# Pain control: new window preserves current path
bind-key "c" new-window -c "#{pane_current_path}"

# Prefix-free pane/window navigation; vim and fzf keep C-n/C-p for completion.
# Avoid C-j: terminals send Shift+Enter as LF (C-j), which TUIs use for newline.
passthrough_keys="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+/)?g?\\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'"
bind-key -n C-n if-shell "$passthrough_keys" "send-keys C-n" "select-pane -t :.+"
bind-key -n C-p if-shell "$passthrough_keys" "send-keys C-p" "select-pane -t :.-"
bind-key -n C-\\ next-window
bind-key -T copy-mode-vi C-n select-pane -t :.+
bind-key -T copy-mode-vi C-p select-pane -t :.-

# local overrides
if-shell -b '[ -f ~/.tmux.local.conf ]' \
	'source-file ~/.tmux.local.conf'
